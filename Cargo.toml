[package]
name = "openapi2curl"
version = "0.1.0"
edition = "2021"
description = "Generates ready-to-run curl commands for every operation in an OpenAPI 3.x spec, with realistic example values filled in"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/openapi2curl"
readme = "README.md"
keywords = ["openapi", "curl", "api", "codegen", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "openapi2curl"
path = "src/lib.rs"

[[bin]]
name = "openapi2curl"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
